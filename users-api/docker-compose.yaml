services:
  fastapi:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - ./user-api:/user-api
    networks:
      - fastapi_network
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: db-server
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: olena
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - fastapi_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_container
    environment:
      PMA_HOST: db  # MySQL Containername (Name des MySQL-Dienstes in Compose)
      MYSQL_ROOT_PASSWORD: root  # Root-Passwort für MySQL
    ports:
      - "8080:80"  # Zugriff über Port 8080 auf phpMyAdmin
    networks:
      - fastapi_network
    restart: always

networks:
  fastapi_network:
    driver: bridge

volumes:
  db_data:
    driver: local