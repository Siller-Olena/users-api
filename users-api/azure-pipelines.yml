trigger:
  branches:
    include:
      - main
      - feature/*

variables:
  - group: 'DockerCredentials'
  - name: DockerId
    value: "$(DOCKER_USERNAME)"
  - name: DockerToken
    value: "$(DOCKER_PASSWORD)"
  - name: DockerRepo
    value: "$(DOCKER_REPO)"
  - name: ServiceName
    value: "$(DOCKER_REPO)"

pool:
  vmImage: 'ubuntu-latest'

stages:

# ======== PRE-BUILD: Извлечение версии ========
- stage: PreBuild
  displayName: 'Pre-Build'
  jobs:
    - job: SetVersionJob
      displayName: 'Извлечь версию приложения'
      steps:
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - script: |
            echo "Current directory:"
            pwd
            echo "Listing all files and folders:"
            ls -la
            chmod +x "$(Build.SourcesDirectory)/users-api/logging.sh"
            chmod +x "$(Build.SourcesDirectory)/users-api/common-script/dockerhub.sh"
          displayName: 'Сделать скрипты исполняемыми'

        - script: |
            sed -i 's/\r$//' "$(Build.SourcesDirectory)/users-api/logging.sh"
            sed -i 's/\r$//' "$(Build.SourcesDirectory)/users-api/common-script/dockerhub.sh"
          displayName: 'Исправить окончания строк'

        - script: |
            . "$(Build.SourcesDirectory)/users-api/logging.sh"
            info_msg "Run logging script"
          displayName: 'Запуск логгера'

        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.x'
            addToPath: true

        - task: Bash@3
          name: setAppVersionStep
          displayName: 'Установить переменную APP_VERSION'
          inputs:
            targetType: 'inline'
            script: |
              VERSION_SCRIPT_PATH="$(Build.SourcesDirectory)/users-api/get_latest_version.py"
              echo "=== Проверка наличия скрипта версии ==="
              if [ ! -f "$VERSION_SCRIPT_PATH" ]; then
                echo "ERROR: Script not found at $VERSION_SCRIPT_PATH"
                exit 1
              fi
              latest_version=$(python3 "$VERSION_SCRIPT_PATH")
              echo "Извлечённая версия: $latest_version"
              if [ -z "$latest_version" ]; then
                echo "APP_VERSION не получена. Прерывание."
                exit 3
              fi
              echo "##vso[task.setvariable variable=APP_VERSION;isOutput=true]$latest_version"

# ======== СБОРКА И ТЕСТЫ ========
- stage: BuildAndTest
  displayName: 'Сборка и тестирование'
  dependsOn: PreBuild
  condition: succeeded()
  jobs:
    - job: BuildAndTest
      displayName: 'Сборка и тесты'
      steps:
        - script: |
            echo "== Компиляция проекта =="
            mkdir -p $(Build.ArtifactStagingDirectory)/build
            echo "Compiled app binary" > $(Build.ArtifactStagingDirectory)/build/app.bin
          displayName: 'Сборка проекта'

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)/build'
            artifactName: 'build-artifact'
            publishLocation: 'Container'
          displayName: 'Публикация артефактов сборки'

        - script: |
            echo "== Юнит-тесты =="
            echo "Эмуляция тестов..."
            echo "Все тесты пройдены"
          displayName: 'Запуск юнит-тестов'

# ======== СБОРКА И PUSH DOCKER ========
- stage: DockerBuildAndPush
  displayName: 'Docker: Сборка и Push'
  dependsOn: PreBuild
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
  variables:
    appVersion: $[ stageDependencies.PreBuild.SetVersionJob.outputs['setAppVersionStep.APP_VERSION'] ]
  jobs:
    - job: BuildAndPush
      displayName: 'Собрать и отправить Docker-образ'
      steps:
        - script: |
            echo "Docker Tag version: $(appVersion)"
          displayName: 'Логируем версию appVersion'

        - task: Docker@2
          displayName: 'Сборка Docker-образа'
          inputs:
            containerRegistry: 'sillerolena'
            repository: 'sillerolena/lab4'
            command: 'build'
            Dockerfile: '$(Build.SourcesDirectory)/users-api/Dockerfile'
            buildContext: '$(Build.SourcesDirectory)/users-api'
            tags: |
              $(appVersion)

        - task: Docker@2
          displayName: 'Push Docker-образа'
          inputs:
            containerRegistry: 'sillerolena'
            repository: 'sillerolena/lab4'
            command: 'push'
            tags: |
              $(appVersion)

# ======== HELM CHART ========
- stage: HelmChartPack
  displayName: 'Helm Chart: Упаковка и Push'
  dependsOn: DockerBuildAndPush
  condition: succeeded()
  jobs:
    - job: PackAndPush
      displayName: 'Упаковка и публикация Helm Chart'
      steps:
        - script: |
            echo "Packing and pushing Helm chart..."
          displayName: 'Helm Chart Step'

# ======== POST-BUILD ========
- stage: PostBuild
  displayName: 'Post-Build'
  dependsOn: HelmChartPack
  condition: succeeded()
  jobs:
    - job: PostBuild
      displayName: 'Финальные действия'
      steps:
        - script: |
            echo "Post-build cleanup or report step"
          displayName: 'Post-Build Step'

