trigger:
  branches:
    include:
      - main
      - feature/*

variables:
  - group: 'DockerCredentials'
  - name: DockerId
    value: "$(DOCKER_ID)"
  - name: DockerToken
    value: "$(DOCKER_TOKEN)"
  - name: DockerRepo
    value: "$(DOCKER_REPO)"
  - name: ServiceName
    value: "$(SERVICE_NAME)"

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
    - repository: users-api
      type: git
      ref: 'refs/heads/main'
      name: user-api

stages:

  - stage: PreBuild
    displayName: 'Pre-Build'
    jobs:
      - job: SetVersionJob
        displayName: 'Pre-Build Analysis'
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - checkout: users-api
            fetchDepth: 0
            persistCredentials: true

          - script: |
              chmod +x "$(Build.SourcesDirectory)/users-api/logging.sh"
              chmod +x "$(Build.SourcesDirectory)/users-api/common-script/dockerhub.sh"
            displayName: 'Make scripts executable'

          - script: |
              sed -i 's/\r$//' "$(Build.SourcesDirectory)/users-api/logging.sh"
              sed -i 's/\r$//' "$(Build.SourcesDirectory)/users-api/common-script/dockerhub.sh"
            displayName: 'Fix line endings in scripts'

          - script: |
              . "$(Build.SourcesDirectory)/users-api/logging.sh"
              info_msg "Run logging script"
            displayName: 'Run Logging Script'

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.x'
              addToPath: true

          - task: Bash@3
            name: setAppVersionStep
            displayName: 'Set APP_VERSION output variable'
            inputs:
              targetType: 'inline'
              script: |
                latest_git_tag=$(python3 $(Build.SourcesDirectory)/users-api/get_latest_version.py)
                echo "latest_git_tag=$latest_git_tag"
                if [ -z "$latest_git_tag" ]; then
                  echo "APP_VERSION not retrieved. Exiting"
                  exit 3
                fi
                IFS='.' read -r -a version_parts <<< "$latest_git_tag"
                major="${version_parts[0]}"
                minor="${version_parts[1]}"
                patch="${version_parts[2]}"
                ((patch++))
                new_version="$major.$minor.$patch"
                echo "New version: $new_version"
                echo "##vso[task.setvariable variable=APP_VERSION;isOutput=true]$new_version"
                echo "APP_VERSION is set to $new_version"

  - stage: BuildAndTest
    displayName: 'Project: Build and Test'
    dependsOn: PreBuild
    condition: succeeded()
    jobs:
      - job: BuildAndTest
        displayName: 'Build And Test'
        steps:
          - script: |
              echo "== Compiling project =="
              mkdir -p $(Build.ArtifactStagingDirectory)/build
              echo "Compiled app binary" > $(Build.ArtifactStagingDirectory)/build/app.bin
            displayName: 'Build Project'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)/build'
              artifactName: 'build-artifact'
              publishLocation: 'Container'
            displayName: 'Publish Build Artifact'

          - script: |
              echo "== Running Unit Tests =="
              echo "Simulating unit tests..."
              echo "All tests passed"
            displayName: 'Run Unit Tests'

  - stage: DockerBuildAndPush
    displayName: 'Docker: Build and Push'
    dependsOn: PreBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
    variables:
      appVersion: $[ stageDependencies.PreBuild.SetVersionJob.outputs['setAppVersionStep.APP_VERSION'] ]
    jobs:
      - job: BuildAndPush
        displayName: 'Build and Push Docker Image'
        steps:
          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              containerRegistry: 'sillerolena'
              repository: 'sillerolena/lab4'
              command: 'build'
              Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(Build.BuildId)
                $(appVersion)

          - task: Docker@2
            displayName: 'Push Docker Image'
            inputs:
              containerRegistry: 'sillerolena'
              repository: 'sillerolena/lab4'
              command: 'push'
              tags: |
                $(Build.BuildId)
                $(appVersion)

  - stage: HelmChartPack
    displayName: 'Helm Chart: Pack and Push'
    dependsOn: DockerBuildAndPush
    condition: succeeded()
    jobs:
      - job: PackAndPush
        displayName: 'Pack and Push'
        steps:
          - script: |
              echo "Packing and pushing Helm chart..."
            displayName: 'Helm Chart Step'

  - stage: PostBuild
    displayName: 'Post-Build'
    dependsOn: HelmChartPack
    condition: succeeded()
    jobs:
      - job: PostBuild
        displayName: 'Post-Build'
        steps:
          - script: |
              echo "Post-build cleanup or report step"
            displayName: 'Post-Build Step'


