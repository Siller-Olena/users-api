trigger:
  branches:
    include:
      - main
      - feature/*

variables:
  - name: DockerRepo
    value: "$(DOCKER_REPO)"
  - name: DockerRegistry
    value: "your_docker_registry"
  - name: DockerRepository
    value: "your_docker_repository"
  - name: appVersion
    value: "$(Build.BuildId)"

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
    - repository: ci-templates
      type: git
      name: olenasiller/ci-templates
      ref: refs/heads/main

stages:
  - template: stages/PreBuildTemplate.yml@ci-templates
    parameters:
      versionScriptPath: "$(Build.SourcesDirectory)/users-api/get_latest_version.py"

  - template: stages/BuildAndTestTemplate.yml@ci-templates
    parameters:
      artifactStagingDirectory: "$(Build.ArtifactStagingDirectory)"

  - template: stages/DockerBuildAndPushTemplate.yml@ci-templates
    parameters:
      dockerRegistry: "$(DockerRegistry)"
      dockerRepository: "$(DockerRepository)"
      appVersion: "$(appVersion)"
