
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'sillerolena'
  imageRepository: 'sillerolena/sillerolena1'
  dockerfilePath: 'users-api/Dockerfile'
  buildContext: 'users-api'
  tag: 'latest'

stages:
  - stage: BuildAndTest
    displayName: 'Build and unit tests'

    jobs:
      - job: Test
        displayName: 'Run Python tests'

        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Set up Python'

          - script: |
              python --version
              python -m pip install --upgrade pip
              python -m pip install -r users-api/requirements.txt
              python -m pip install pytest
            displayName: 'Install dependencies'

          - script: |
              cd users-api
              python -m pytest -v --junitxml=test-results.xml
            displayName: 'Run unit tests'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: 'users-api/test-results.xml'
              testRunTitle: 'Unit tests'

  - stage: DockerPublish
    displayName: 'Docker build, tag and push'
    dependsOn: BuildAndTest
    condition: succeeded()

    jobs:
      - job: Docker
        displayName: 'Build and push Docker image'

        steps:
          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: build
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: $(buildContext)
              tags: |
                $(tag)
                $(Build.BuildId)

          - task: Docker@2
            displayName: 'Push image to Docker Hub'
            inputs:
              command: push
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(imageRepository)
              tags: |
                $(tag)
                $(Build.BuildId)

