trigger:
  branches:
    include:
      - main
      - feature/*

variables:
  - group: 'DockerCredentials'
  - name: DockerId
    value: "$(DOCKER_USERNAME)"
  - name: DockerToken
    value: "$(DOCKER_PASSWORD)"
  - name: DockerRepo
    value: "$(DOCKER_REPO)"
  - name: ServiceName
    value: "$(DOCKER_REPO)"

pool:
  vmImage: 'ubuntu-latest'

stages:

# ======== PRE-BUILD ========
- template: templates/stages/dotnet/build-n-test/v1.yaml@ci-common-templates
  parameters:
    ServiceName: $(ServiceName)
    versionScriptPath: "$(Build.SourcesDirectory)/users-api/get_latest_version.py"
    artifactName: "build-artifact"
    vmPool: 'Azure Pipelines'
    vmImage: 'ubuntu-latest'

# ======== BUILD & TEST ========
- template: templates/stages/dotnet/build-n-test/v2.yaml@ci-common-templates
  parameters:
    appVersion: "$(appVersion)"
    artifactName: "build-artifact"
    buildSettings:
      someSetting: "value"

# ======== DOCKER BUILD & PUSH ========
- template: templates/stages/docker/build-n-push/v1.yaml@ci-common-templates
  parameters:
    serviceName: $(ServiceName)
    dockerfilePath: "$(Build.SourcesDirectory)/users-api/Dockerfile"
    buildContext: "$(Build.SourcesDirectory)/users-api"
    dockerRegistry: "sillerolena"
    repository: "sillerolena/lab4"
    tags: "$(appVersion)"

# ======== POST-BUILD ========
- stage: PostBuild
  displayName: 'Post-Build'
  dependsOn: []
  condition: succeeded()
  jobs:
    - job: PostBuild
      displayName: 'Финальные действия'
      steps:
        - script: |
            echo "Post-build cleanup or report step"
          displayName: 'Post-Build Step'

