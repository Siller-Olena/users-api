parameters:
  - name: ciTemplates  # Назва параметра
    type: string        # Тип параметра
  - name: appVersion    # Інший параметр
    type: string
    default: ''

  - name: DockerRepo    # Параметр для Docker-репозиторію
    type: string
    default: 'myDockerRepo'
trigger:
  branches:
    include:
      - main
      - feature/*

variables:
  - group: 'DockerCredentials'
  - name: appVersion
    value: $[ stageDependencies.PreBuild.SetVersionJob.outputs['setAppVersionStep.APP_VERSION'] ]
  - name: DockerToken
    value: "$(DOCKER_PASSWORD)"
  - name: DockerRepo
    value: "$(DOCKER_REPO)"
  - name: ServiceName
    value: "$(DOCKER_REPO)"

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
    - repository: ci-templates
      type: git
      name: olenasiller/ci-templates
      ref: refs/heads/main

stages:
  # ======== PRE-BUILD: Извлечение версии ========
  - template: templates/stages/dotnet/build-n-test/v1.yaml@ci-templates
    parameters:
      versionScriptPath: "$(Build.SourcesDirectory)/users-api/get_latest_version.py"
      loggingScriptPath: "$(Build.SourcesDirectory)/users-api/logging.sh"
      dockerhubScriptPath: "$(Build.SourcesDirectory)/users-api/common-script/dockerhub.sh"
      artifactStagingDirectory: "$(Build.ArtifactStagingDirectory)"
  # ======== СБОРКА И ТЕСТЫ ========
  - template: templates/stages/dotnet/build-n-test/v2.yaml@ci-templates
    parameters:
      versionScriptPath: "$(Build.SourcesDirectory)/users-api/get_latest_version.py"
      loggingScriptPath: "$(Build.SourcesDirectory)/users-api/logging.sh"
      dockerhubScriptPath: "$(Build.SourcesDirectory)/users-api/common-script/dockerhub.sh"
      artifactStagingDirectory: "$(Build.ArtifactStagingDirectory)"

  # ======== СБОРКА И PUSH DOCKER ========
  - template: templates/stages/docker/build-n-push/v1.yaml@ci-templates
    parameters:
      dockerSettings:
        dockerRegistry: "$(DockerRegistry)"
        dockerRepository: "$(DockerRepository)"
        appVersion: "$(appVersion)"

  # ======== HELM CHART ========
  - stage: HelmChartPack
    displayName: 'Helm Chart: Упаковка и Push'
    dependsOn: DockerBuildAndPush
    condition: succeeded()
    jobs:
      - job: PackAndPush
        displayName: 'Упаковка и публикация Helm Chart'
        steps:
          - script: |
              echo "Packing and pushing Helm chart..."
            displayName: 'Helm Chart Step'


  # ======== POST-BUILD ========
  - stage: PostBuild
    displayName: 'Post-Build'
    dependsOn: HelmChartPack
    condition: succeeded()
    jobs:
      - job: PostBuild
        displayName: 'Финальные действия'
        steps:
          - script: |
              echo "Post-build cleanup or report step"
            displayName: 'Post-Build Step'
