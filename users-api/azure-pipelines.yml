trigger:
  branches:
    include:
      - main
      - feature/*
    

variables:
  - name: DockerRepo
    value: "$(DOCKER_REPO)"
  - name: DockerRegistry
    value: "your_docker_registry"
  - name: DockerRepository
    value: "your_docker_repository"
  - name: appVersion
    value: "$(Build.BuildId)"

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
    - repository: ci-templates
      type: git
      name: olenasiller/ci-templates
      ref: refs/heads/main

stages:
  - template: ci-templates/stages/PreBuildTemplate.yml
    parameters:
      versionScriptPath: "$(Build.SourcesDirectory)/path/to/your/version/script"

  - template: ci-templates/stages/BuildAndTestTemplate.yml
    parameters:
      artifactStagingDirectory: "$(Build.ArtifactStagingDirectory)"

  - template: ci-templates/stages/DockerBuildAndPushTemplate.yml
    parameters:
      dockerRegistry: "$(DockerRegistry)"
      dockerRepository: "$(DockerRepository)"
      appVersion: "$(appVersion)"
