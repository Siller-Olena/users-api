trigger:
  branches:
    include:
      - main
      - feature/*

variables:
  - group: 'DockerCredentials'
  - name: DockerId
    value: "$(DOCKER_USERNAME)"
  - name: DockerToken
    value: "$(DOCKER_PASSWORD)"
  - name: DockerRepo
    value: "$(DOCKER_REPO)"
  - name: ServiceName
    value: "$(DOCKER_REPO)"

pool:
  vmImage: 'ubuntu-latest'

stages:

# === PRE-BUILD ===
- stage: PreBuild
  displayName: 'Pre-Build'
  jobs:
    - job: SetVersionJob
      displayName: 'Pre-Build Analysis'
      steps:
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - script: |
            echo "Current directory:"
            pwd
            echo "Listing all files and folders:"
            ls -la
            chmod +x "$(Build.SourcesDirectory)/users-api/logging.sh"
            chmod +x "$(Build.SourcesDirectory)/users-api/common-script/dockerhub.sh"
          displayName: 'Make scripts executable'

        - script: |
            sed -i 's/\r$//' "$(Build.SourcesDirectory)/users-api/logging.sh"
            sed -i 's/\r$//' "$(Build.SourcesDirectory)/users-api/common-script/dockerhub.sh"
          displayName: 'Fix line endings in scripts'

        - script: |
            . "$(Build.SourcesDirectory)/users-api/logging.sh"
            info_msg "Run logging script"
          displayName: 'Run Logging Script'

        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.x'
            addToPath: true

        - task: Bash@3
          name: setAppVersionStep
          displayName: 'Set APP_VERSION output variable'
          inputs:
            targetType: 'inline'
            script: |
              VERSION_SCRIPT_PATH="$(Build.SourcesDirectory)/users-api/get_latest_version.py"
              echo "=== Checking if version script exists ==="
              if [ ! -f "$VERSION_SCRIPT_PATH" ]; then
                echo "ERROR: Script not found at $VERSION_SCRIPT_PATH"
                exit 1
              fi
              latest_version=$(python3 "$VERSION_SCRIPT_PATH")
              echo "Extracted version: $latest_version"
              if [ -z "$latest_version" ]; then
                echo "APP_VERSION not retrieved. Exiting"
                exit 3
              fi
              echo "##vso[task.setvariable variable=APP_VERSION;isOutput=true]$latest_version"

# === BUILD AND TEST ===
- stage: BuildAndTest
  displayName: 'Project: Build and Test'
  dependsOn: PreBuild
  condition: succeeded()
  jobs:
    - job: BuildAndTest
      displayName: 'Build And Test'
      steps:
        - script: |
            echo "== Compiling project =="
            mkdir -p $(Build.ArtifactStagingDirectory)/build
            echo "Compiled app binary" > $(Build.ArtifactStagingDirectory)/build/app.bin
          displayName: 'Build Project'

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)/build'
            artifactName: 'build-artifact'
            publishLocation: 'Container'
          displayName: 'Publish Build Artifact'

        - script: |
            echo "== Running Unit Tests =="
            echo "Simulating unit tests..."
            echo "All tests passed"
          displayName: 'Run Unit Tests'

# === DOCKER BUILD AND PUSH ===
- stage: DockerBuildAndPush
  displayName: 'Docker: Build and Push'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
  variables:
    appVersion: $[ stageDependencies.PreBuild.SetVersionJob.outputs['setAppVersionStep.APP_VERSION'] ]
  jobs:
    - job: BuildAndPush
      displayName: 'Build and Push Docker Image'
      steps:
        - script: |
            echo ">>> appVersion is: $(appVersion)"
          displayName: 'Debug: Show appVersion'

        - task: Docker@2
          displayName: 'Build Docker Image'
          inputs:
            containerRegistry: 'sillerolena'
            repository: 'sillerolena/lab4'
            command: 'build'
            Dockerfile: '$(Build.SourcesDirectory)/users-api/Dockerfile'
            buildContext: '$(Build.SourcesDirectory)/users-api'
            tags: |
              $(appVersion)

        - task: Docker@2
          displayName: 'Push Docker Image'
          inputs:
            containerRegistry: 'sillerolena'
            repository: 'sillerolena/lab4'
            command: 'push'
            tags: |
              $(appVersion)

# === HELM CHART PACK ===
- stage: HelmChartPack
  displayName: 'Helm Chart: Pack and Push'
  dependsOn: DockerBuildAndPush
  condition: succeeded()
  jobs:
    - job: PackAndPush
      displayName: 'Pack and Push Helm Chart'
      steps:
        - script: |
            echo "Packing and pushing Helm chart..."
            helm package ./charts/mychart
            helm push ./mychart-*.tgz oci://myacr.azurecr.io/charts
          displayName: 'Helm Chart Step'

# === POST-BUILD ===
- stage: PostBuild
  displayName: 'Post-Build'
  dependsOn: HelmChartPack
  condition: succeeded()
  jobs:
    - job: PostBuild
      displayName: 'Post-Build'
      steps:
        - script: |
            echo "Post-build cleanup or report step"
          displayName: 'Post-Build Step'
