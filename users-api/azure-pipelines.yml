resources:
  repositories:
    - repository: ci-common-templates
      type: git
      name: ci-templates/templates/build-n-test
      ref: 'refs/heads/main'

trigger:
  branches:
    include:
      - main
      - feature/*

variables:
  - group: 'DockerCredentials'
  - name: DockerId
    value: "$(DOCKER_USERNAME)"
  - name: DockerToken
    value: "$(DOCKER_PASSWORD)"
  - name: DockerRepo
    value: "$(DOCKER_REPO)"
  - name: ServiceName
    value: "$(DOCKER_REPO)"

pool:
  vmImage: 'ubuntu-latest'

stages:

# ======== PRE-BUILD: Извлечение версии ========
# Pre-Build stage через шаблон
- template: templates/stages/build-n-test/v1.yaml@ci-common-templates
  parameters:
    ServiceName: $(ServiceName)
    versionScriptPath: "$(Build.SourcesDirectory)/users-api/get_latest_version.py"
    artifactName: "build-artifact"  # Передаем имя артефакта
    vmPool: 'Azure Pipelines'
    vmImage: 'ubuntu-latest'
     script: |
    echo "##vso[task.setvariable variable=appVersion;isOutput=true]$(APP_VERSION)"
    name: setAppVersionOutput

# ======== СБОРКА И ТЕСТЫ ========
- stage: BuildAndTest
  displayName: 'Сборка и тестирование'
  dependsOn: PreBuild
  condition: succeeded()
  variables:
    appVersion: $[stageDependencies.PreBuild.SetVersionJob.outputs['setAppVersionOutput.appVersion']]  # Получаем значение из PreBuild
  template: templates/stages/build-n-test/v2.yaml@ci-common-templates
  parameters:
    appVersion: $(appVersion)
    artifactName: 'build-artifact'
    buildSettings:
      someSetting: 'value'

# ======== СБОРКА И PUSH DOCKER ========
-- template: templates/stages/docker/dockerBuildAndPush.yaml@ci-common-templates
  parameters:
    serviceName: $(ServiceName)
    dockerfilePath: "$(Build.SourcesDirectory)/users-api/Dockerfile"
    buildContext: "$(Build.SourcesDirectory)/users-api"
    dockerRegistry: 'sillerolena'  # Укажите свой контейнерный реестр
    repository: 'sillerolena/lab4'  # Репозиторий, куда будет отправляться образ
    tags: "$(appVersion)"

# ======== HELM CHART ========
- stage: HelmChartPack
  displayName: 'Helm Chart: Упаковка и Push'
  dependsOn: DockerBuildAndPush
  condition: succeeded()
  jobs:
    - job: PackAndPush
      displayName: 'Упаковка и публикация Helm Chart'
      steps:
        - script: |
            echo "Packing and pushing Helm chart..."
          displayName: 'Helm Chart Step'

# ======== POST-BUILD ========
- stage: PostBuild
  displayName: 'Post-Build'
  dependsOn: HelmChartPack
  condition: succeeded()
  jobs:
    - job: PostBuild
      displayName: 'Финальные действия'
      steps:
        - script: |
            echo "Post-build cleanup or report step"
          displayName: 'Post-Build Step'

