# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

stages:
# Stage 1: Pre-Build
- stage: PreBuild
  displayName: Pre-Build
  condition: always()
  jobs:
  - job: PreBuildAnalysis
    displayName: Pre-Build Analysis
    steps:
    - script: |
        echo "Hello from Pre-Build Job"
        echo "Pipeline Variables:"
        echo "Agent.TempDirectory: $(Agent.TempDirectory)"
        echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
        echo "Build.Repository.LocalPath: $(Build.Repository.LocalPath)"
        echo "Build.Repository.Name: $(Build.Repository.Name)"
        echo "Build.SourceBranch: $(Build.SourceBranch)"
        echo "Build.SourceBranchName: $(Build.SourceBranchName)"
        echo "Build.SourcesDirectory: $(Build.SourcesDirectory)"
        echo "Build.StagingDirectory: $(Build.StagingDirectory)"
      displayName: Print Azure DevOps Pipeline predefined variables

# Stage 2: Build and Test
- stage: BuildAndTest
  displayName: Project: Build and Test
  dependsOn: PreBuild
  condition: succeeded()
  jobs:
  - job: BuildAndTest
    displayName: Build and Test
    steps:
    - script: |
        echo "Running Build and Test steps..."
        # Example for Python project (заміни під свій стек)
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pytest
      displayName: Run tests

# Stage 3: Docker Build and Push (тільки для main)
- stage: DockerBuildPush
  displayName: Docker: Build and Push
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
  jobs:
  - job: BuildAndPush
    displayName: Build and Push Docker Image
    steps:
    - script: |
        echo "Building Docker image..."
        docker build -t my-image .
        echo "Tagging Docker image..."
        docker tag my-image myregistry.azurecr.io/my-image:latest
        echo "Pushing Docker image..."
        docker push myregistry.azurecr.io/my-image:latest
      displayName: Build and Push Docker

# Stage 4: Helm Pack and Push (тільки для main)
- stage: HelmChartPackPush
  displayName: Helm Chart: Pack and Push
  dependsOn: DockerBuildPush
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
  jobs:
  - job: PackAndPush
    displayName: Pack and Push Helm Chart
    steps:
    - script: |
        echo "Packing Helm Chart..."
        helm package ./helm-chart
        echo "Pushing Helm Chart..."
        helm push ./helm-chart-*.tgz oci://myregistry.azurecr.io/helm
      displayName: Pack and Push Helm Chart

# Stage 5: Post-Build
- stage: PostBuild
  displayName: Post-Build
  dependsOn: HelmChartPackPush
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
  jobs:
  - job: PostBuild
    displayName: Post-Build Actions
    steps:
    - script: |
        echo "Post-build cleanup or notifications"
      displayName: Final step



