trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: 'ubuntu-latest'

stages:
# === STAGE 1: PRE-BUILD ===
- stage: PreBuild
  displayName: 'Pre-Build Stage'
  jobs:
    - job: PrintInfo
      displayName: 'Pre-Build Analysis'
      steps:
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - script: |
            echo "🔎 Printing Azure DevOps predefined variables:"
            echo "Agent.TempDirectory: $(Agent.TempDirectory)"
            echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
            echo "Build.Repository.LocalPath: $(Build.Repository.LocalPath)"
            echo "Build.Repository.Name: $(Build.Repository.Name)"
            echo "Build.SourceBranch: $(Build.SourceBranch)"
            echo "Build.SourceBranchName: $(Build.SourceBranchName)"
            echo "Build.SourcesDirectory: $(Build.SourcesDirectory)"
            echo "Build.StagingDirectory: $(Build.StagingDirectory)"
          displayName: 'Print Azure DevOps Pipeline predefined variables'

# === STAGE 2: BUILD & TEST ===
- stage: BuildAndTest
  displayName: 'Project: Build and Test'
  dependsOn: PreBuild
  condition: succeeded()
  jobs:
    - job: BuildTest
      displayName: 'Build and Test'
      steps:
        - script: |
            echo "Checking for the presence of requirements.txt..."
            if [ -f "requirements.txt" ]; then
              echo "✅ requirements.txt found."
            else
              echo "⚠️ requirements.txt not found. Skipping installation."
              exit 0
            fi
          displayName: 'Check requirements.txt'

        - script: |
            echo "Installing Python and dependencies..."
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          displayName: 'Install Requirements'
          condition: exists('requirements.txt')

        - script: |
            echo "Installing pytest..."
            pip install pytest
          displayName: 'Install pytest'

        - script: |
            echo "Checking Python and pip versions..."
            python --version
            pip --version
          displayName: 'Check Python and Pip Versions'

        - script: |
            echo "Checking if test files exist..."
            if [ -d "tests" ]; then
              echo "✅ 'tests' directory found."
              ls -R tests
            else
              echo "⚠️ No 'tests/' directory found. Skipping tests."
            fi
          displayName: 'Check Test Files'

        - script: |
            echo "Running tests with pytest..."
            if [ -d "tests" ]; then
              pytest --maxfail=1 --disable-warnings -q || echo "⚠️ Some tests failed or none were found."
            else
              echo "⚠️ Skipping pytest because no 'tests/' folder found."
            fi
          displayName: 'Run Tests'

# === STAGE 3: DOCKER BUILD & PUSH ===
- stage: DockerBuildAndPush
  displayName: 'Docker: Build and Push'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
  variables:
    - group: Docker Access Token  # Використовується Variable Group з Library
  jobs:
    - job: DockerJob
      displayName: 'Docker Build and Push'
      steps:
        - script: |
            echo "Logging in to Docker Hub..."
            echo "Using username: $DOCKER_USERNAME"
            echo "DOCKER_PASSWORD is set: ${DOCKER_PASSWORD:0:1}***"

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin || {
              echo "❌ Docker login failed. Check your credentials."
              exit 1
            }
          displayName: '**Docker Login**'

        - script: |
            IMAGE_NAME=$DOCKER_USERNAME/user-api:$(Build.BuildId)
            echo "Building Docker image: $IMAGE_NAME"
            docker build -t $IMAGE_NAME .

            echo "Pushing Docker image: $IMAGE_NAME"
            docker push $IMAGE_NAME
          displayName: '**Docker Build & Push**'

# === STAGE 4: HELM PACK ===
- stage: HelmChartPack
  displayName: 'Helm Chart: Pack and Push'
  dependsOn: DockerBuildAndPush
  condition: succeeded()
  jobs:
    - job: HelmJob
      displayName: 'Pack and Push Helm Chart'
      steps:
        - script: |
            echo "Packaging Helm chart..."
            if [ -d "./chart" ]; then
              helm package ./chart
              echo "✅ Helm chart packaged."
              # helm push ./chart-*.tgz my-helm-repo
            else
              echo "⚠️ Helm chart folder not found. Skipping."
            fi
          displayName: 'Pack & Push Helm Chart'

# === STAGE 5: CLEANUP ===
- stage: PostBuild
  displayName: 'Post-Build Stage'
  dependsOn: HelmChartPack
  condition: succeeded()
  jobs:
    - job: Cleanup
      displayName: 'Post-Build Cleanup'
      steps:
        - script: |
            echo "✅ Pipeline finished. Cleanup complete."
          displayName: 'Final Cleanup'
