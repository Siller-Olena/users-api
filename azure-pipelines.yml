trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: docker-settings
  - name: olenasiller
    value: '1.0.0'

stages:
  - stage: PreBuild
    displayName: 'Pre-Build'
    jobs:
      - job: PreBuildAnalysis
        displayName: 'Pre-Build Analysis'
        steps:
          - checkout: self
            persistCredentials: true

          - script: echo "✅ Pre-build: ok"
            displayName: 'Pre-build Hello'

  - stage: BuildAndTest
    displayName: 'Project: Build and Test'
    dependsOn: PreBuild
    condition: succeeded()
    jobs:
      - job: BuildAndTest
        displayName: 'Build and Unit Tests'
        steps:
          - script: |
              echo "🔨 Building the project..."
              make build
            displayName: 'Build'

          - script: |
              echo "🧪 Running Unit Tests..."
              make test
            displayName: 'Unit Tests'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'bin'
              artifactName: 'build-artifacts'
              publishLocation: 'Container'
            displayName: '📦 Publish Build Artifacts'

  - stage: DockerBuildAndPush
    displayName: 'Docker: Build and Push'
    dependsOn: BuildAndTest
    condition: eq(variables['Build.SourceBranchName'], 'main')
    jobs:
      - job: DockerBuild
        displayName: 'Build Docker Image'
        steps:
          - task: Docker@2
            inputs:
              command: build
              Dockerfile: 'Dockerfile'
              tags: |
                $(DOCKER_REGISTRY)/$(DOCKER_REPOSITORY):$(FORCED_VERSION)
            displayName: '🐳 Docker Build'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Pipeline.Workspace)'
              artifactName: 'docker-image-files'
              publishLocation: 'Container'
            displayName: '📦 Save Docker Image Files (optional)'

      - job: DockerPush
        displayName: 'Push Docker Image'
        dependsOn: DockerBuild
        steps:
          - task: Docker@2
            inputs:
              command: push
              tags: |
                $(DOCKER_REGISTRY)/$(DOCKER_REPOSITORY):$(FORCED_VERSION)
            displayName: '📤 Push Docker Image'




