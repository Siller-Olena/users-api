trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRepo: 'sillerolena/lab4'
  serviceName: 'sillerolena'
  appVersion: 'latest'  # або встановлюй з git tag чи змінної

# 🔹 Stage A: PreBuild
- stage: StageID_PreBuild
  displayName: 'Pre-Build'
  jobs:
    - job: JobID_PreBuildAnalysis
      displayName: 'Pre-Build Analysis'
      steps:
        - script: echo "Hello from PreBuild!"
          displayName: 'Say Hello'
        - script: |
            echo "Repository: $(Build.Repository.Name)"
            echo "Branch: $(Build.SourceBranchName)"
          displayName: 'Print Info'

# 🔸 Stage B: Build and Test
- stage: StageID_BuildAndTestProject
  displayName: 'Project: Build and Test'
  dependsOn: StageID_PreBuild
  jobs:
    - job: JobID_BuildAndTest
      displayName: 'Build and Test'
      steps:
        - script: |
            echo "🔧 Building the project..."
            make build
          displayName: 'Б1: Build service'

        - script: |
            echo "🧪 Running unit tests..."
            make test
          displayName: 'Б2: Run unit tests'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Build Artifacts'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)'
            artifact: 'build-artifacts'
            publishLocation: 'pipeline'

# 🔸 Stage C: Docker Build & Push
- stage: StageID_BuildAndPushDockerImage
  displayName: 'Docker: Build and Push'
  dependsOn: StageID_BuildAndTestProject
  condition: eq(variables['Build.SourceBranchName'], 'main')  # Г1
  jobs:
    - job: JobID_BuildAndPushDockerImage
      displayName: 'Build and Push'
      steps:
        - script: |
            echo "🐳 Building Docker image..."
            docker build -t $(dockerRepo)/$(serviceName):$(appVersion) .
          displayName: 'В1: Docker build'

        - script: |
            echo "📦 Saving Docker image..."
            mkdir -p $(Build.ArtifactStagingDirectory)/docker
            docker save -o $(Build.ArtifactStagingDirectory)/docker/$(serviceName)_$(appVersion).tar $(dockerRepo)/$(serviceName):$(appVersion)
          displayName: 'В2: Save image to artifact'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Docker Image Artifact'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/docker'
            artifact: 'docker-image'

        - task: Docker@2
          displayName: 'Г2: Docker Login'
          inputs:
            command: login
            containerRegistry: 'DockerHubServiceConnection'  # Заздалегідь створене з'єднання

        - task: Docker@2
          displayName: 'Г2: Push Docker Image'
          inputs:
            command: push
            repository: '$(dockerRepo)/$(serviceName)'
            tags: |
              $(appVersion)

# ✅ Stage D: Post Build
- stage: StageID_PostBuild
  displayName: 'Post-Build'
  dependsOn: StageID_BuildAndPushDockerImage
  condition: succeeded()
  jobs:
    - job: JobID_PostBuild
      displayName: 'Post-Build'
      steps:
        - script: echo "🎉 Pipeline completed successfully"
          displayName: 'Post Build Message'



