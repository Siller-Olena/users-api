# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

stages:

# === 1. Pre-Build ===
- stage: PreBuild
  displayName: Pre-Build
  jobs:
  - job: PreBuildAnalysis
    displayName: Pre-Build Analysis
    steps:
    - script: |
        echo "Hello, from Pre-Build Job"
        echo "Print predefined variables:"
        echo "Agent.TempDirectory: $(Agent.TempDirectory)"
        echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
        echo "Build.Repository.LocalPath: $(Build.Repository.LocalPath)"
        echo "Build.Repository.Name: $(Build.Repository.Name)"
        echo "Build.SourceBranch: $(Build.SourceBranch)"
        echo "Build.SourceBranchName: $(Build.SourceBranchName)"
        echo "Build.SourcesDirectory: $(Build.SourcesDirectory)"
        echo "Build.StagingDirectory: $(Build.StagingDirectory)"
      displayName: 'Print Azure DevOps Predefined Variables'

# === 2. Build and Test ===
- stage: BuildAndTest
  displayName: Project: Build and Test
  dependsOn: PreBuild
  condition: succeeded()
  jobs:
  - job: BuildAndTest
    displayName: Build and Test
    steps:
    - script: |
        echo "Running Build and Test steps..."
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pytest
      displayName: Run tests

# === 3. Docker Build and Push (only for main) ===
- stage: DockerBuildAndPush
  displayName: Docker: Build and Push
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: BuildAndPush
    displayName: Build and Push
    steps:
    - script: |
        echo "Docker Build and Push step..."
        # Тут буде твій docker build, tag і push (наприклад)
        echo "docker build -t my-image ."
        echo "docker push my-image"
      displayName: 'Build and Push Docker Image'

# === 4. Helm Chart Pack and Push (only for main) ===
- stage: HelmChartPack
  displayName: Helm Chart: Pack and Push
  dependsOn: DockerBuildAndPush
  condition: succeeded()
  jobs:
  - job: PackAndPush
    displayName: Pack and Push
    steps:
    - script: |
        echo "Packing and pushing Helm chart..."
        # helm package ./chart && helm push ...
      displayName: 'Pack and Push Helm Chart'

# === 5. Post-Build ===
- stage: PostBuild
  displayName: Post-Build
  dependsOn: HelmChartPack
  condition: succeeded()
  jobs:
  - job: PostBuild
    displayName: Post-Build
    steps:
    - script: |
        echo "Hello from Post-Build Job"
      displayName: 'Post-Build Cleanup'



