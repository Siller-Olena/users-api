trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
    - repository: ciTemplates
      type: git
      name: ProjectName/ci-templates  # Заміни на свою назву

parameters:
  - name: FORCED_VERSION
    default: ''

variables:
  - group: docker-settings
  - name: FORCED_VERSION
    value: ${{ parameters.FORCED_VERSION }}

stages:
  - stage: PreBuild
    displayName: 'Pre-Build'
    jobs:
      - job: PreBuildAnalysis
        displayName: 'Pre-Build Analysis'
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true
            
          - checkout: ci-common-Templates
             fetchDepth: 0
            persistCredentials: true
            
          - task: Bash@3
            name: HelloStep
            inputs:
              targetType: 'inline'
              script: |
                echo "Hello, from Pre-Build Job"

          - task: Bash@3
            name: PrintVariables
            inputs:
              targetType: 'inline'
              script: |
                source $(Pipeline.Workspace)/ciTemplates/common-scripts/logging.sh
                info_msg "Agent.TempDirectory: $(Agent.TempDirectory)"
                info_msg "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
                info_msg "Build.Repository.LocalPath: $(Build.Repository.LocalPath)"
                info_msg "Build.Repository.Name: $(Build.Repository.Name)"
                info_msg "Build.SourceBranch: $(Build.SourceBranch)"
                info_msg "Build.SourceBranchName: $(Build.SourceBranchName)"
                info_msg "Build.SourcesDirectory: $(Build.SourcesDirectory)"
                info_msg "Build.StagingDirectory: $(Build.StagingDirectory)"

          - task: Bash@3
            name: CalculateAppVersion
            inputs:
              targetType: 'inline'
              script: |
                source $(Pipeline.Workspace)/ciTemplates/common-scripts/logging.sh

                if [ -n "$(FORCED_VERSION)" ]; then
                  info_msg "Using FORCED_VERSION: $(FORCED_VERSION)"
                  echo "##vso[task.setvariable variable=APP_VERSION]$(FORCED_VERSION)"
                else
                  bash $(Pipeline.Workspace)/ciTemplates/common-scripts/dockerhub.sh "$(DOCKER_REPOSITORY)"
                fi

  - stage: BuildAndTest
    displayName: 'Project: Build and Test'
    dependsOn: PreBuild
    condition: succeeded()
    jobs:
      - job: BuildAndTest
        displayName: 'Build And Test'
        steps:
          - script: |
              echo "Hello, from Build and Test Job"
            displayName: 'Build and Test Step'

  - stage: DockerBuildAndPush
    displayName: 'Docker: Build and Push'
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: BuildAndPush
        displayName: 'Build and Push'
        steps:
          - script: |
              echo "Hello, from Docker Build and Push Job"
            displayName: 'Docker Step'

  - stage: HelmChartPack
    displayName: 'Helm Chart: Pack and Push'
    dependsOn: DockerBuildAndPush
    condition: succeeded()
    jobs:
      - job: PackAndPush
        displayName: 'Pack and Push'
        steps:
          - script: |
              echo "Hello, from Helm Chart Pack and Push Job"
            displayName: 'Helm Chart Step'

  - stage: PostBuild
    displayName: 'Post-Build'
    dependsOn: HelmChartPack
    condition: succeeded()
    jobs:
      - job: PostBuild
        displayName: 'Post-Build'
        steps:
          - script: |
              echo "Hello, from Post-Build Job"
            displayName: 'Post-Build Step'


