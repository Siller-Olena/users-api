name: Build and Test

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  build-n-test:
    name: build-n-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (build project)
        working-directory: users-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: users-api
        run: pytest -v

  docker-pack-n-push:
    name: docker-pack-n-push
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image-name: sillerolenasillerolena2/sillerolena1
      image-tag: latest
      push-to-registry: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      docker-username: ${{ secrets.DOCKERHUB_USERNAME }}
      docker-password: ${{ secrets.DOCKERHUB_TOKEN }}