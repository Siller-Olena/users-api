name: Docker Pack and Push (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker Hub repository name (e.g. username/repo)'
        required: true
        type: string
      image-tag:
        description: 'Docker image tag'
        required: false
        type: string
        default: 'latest'
      dockerfile-path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'users-api/Dockerfile'
      build-context:
        description: 'Docker build context'
        required: false
        type: string
        default: 'users-api'
      push-to-registry:
        description: 'true = push to Docker Hub, false = save as artifact'
        required: false
        type: boolean
        default: false
    secrets:
      docker-username:
        required: true
      docker-password:
        required: true

jobs:
  docker-pack-n-push:
    name: docker-pack-n-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f ${{ inputs.dockerfile-path }} \
            -t ${{ inputs.image-name }}:${{ inputs.image-tag }} \
            ${{ inputs.build-context }}

      - name: Log in to Docker Hub
        if: ${{ inputs.push-to-registry }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker-username }}
          password: ${{ secrets.docker-password }}

      - name: Push Docker image to Docker Hub
        if: ${{ inputs.push-to-registry }}
        run: docker push ${{ inputs.image-name }}:${{ inputs.image-tag }}

      - name: Save Docker image as tar (non-main branches)
        if: ${{ !inputs.push-to-registry }}
        run: docker save ${{ inputs.image-name }}:${{ inputs.image-tag }} -o docker-image.tar

      - name: Upload Docker image artifact
        if: ${{ !inputs.push-to-registry }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar
          retention-days: 7